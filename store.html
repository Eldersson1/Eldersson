<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AS7i1lnT9wxbv2BKw15yUWQN3rmQxh_sxeqVoAUON78UQnIlVVTT3nla1C3SYd_k1rMFqF5TyENq82PN&currency=USD"></script>
    <style>
        /* Add your styles here */
        @font-face {
            font-family: 'luckiest-guy';
            src: url('fonts/luckiest-guy.ttf');
        }

        /* Existing CSS you provided here */
        body {
            background: var(--background);
            padding: 10px;
            opacity: 0;
            transition: opacity 2s;
            font-family: 'roboto';
        }
        .card {
            background: var(--card-background);
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            padding: 15px;
            margin: 15px;
            max-width: 300px;
        }
        .card img {
            max-width: 100%;
            border-radius: 10px;
        }
        .button {
            background: var(--main-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .button:hover {
            background: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="grid" id="product-list"></div>

    <div class="cart">
        <h2>Cart</h2>
        <ul id="cart-list"></ul>
        <div id="checkout-buttons">
            <div id="paypal-button-container"></div>
        </div>
        <p id="confirmation" style="display: none;"></p>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Product 1', price: 19.99, image: 'https://via.placeholder.com/250x150' },
            { id: 2, name: 'Product 2', price: 29.99, image: 'https://via.placeholder.com/250x150' },
            { id: 3, name: 'Product 3', price: 39.99, image: 'https://via.placeholder.com/250x150' }
        ];

        const cart = [];

        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}">
                    <h2>${p.name}</h2>
                    <p>$${p.price}</p>
                    <button class="button" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = cart.length ? cart.map(item => `<li>${item.name} - $${item.price}</li>`).join('') : 'Your cart is empty.';

            paypal.Buttons({
                createOrder: function(data, actions) {
                    const total = cart.reduce((sum, item) => sum + item.price, 0).toFixed(2);
                    return actions.order.create({
                        purchase_units: [{ amount: { value: total } }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        document.getElementById('confirmation').style.display = 'block';
                        document.getElementById('confirmation').textContent = 'Payment successful! Thank you, ' + details.payer.name.given_name + '!';
                        cart.length = 0;
                        renderCart();
                    });
                }
            }).render('#paypal-button-container');
        }

        renderProducts();
        renderCart();
    </script>
</body>
</html>
