<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        .cart { margin-top: 20px; }
        .button { padding: 10px 15px; background-color: #007bff; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
        .button:disabled { background-color: #ccc; }
    </style>
</head>
<body>
    <div class="grid" id="product-list"></div>

    <div class="cart">
        <h2>Cart</h2>
        <ul id="cart-list"></ul>
        <div id="checkout-buttons">
            <button class="button" onclick="checkout('card')">Checkout with Card</button>
            <button class="button" onclick="checkout('paypal')">Checkout with PayPal</button>
        </div>
        <p id="confirmation" style="display: none;"></p>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Product 1', price: 19.99 },
            { id: 2, name: 'Product 2', price: 29.99 },
            { id: 3, name: 'Product 3', price: 39.99 }
        ];

        const cart = [];

        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = products.map(p => `
                <div class="card">
                    <h2>${p.name}</h2>
                    <p>$${p.price}</p>
                    <button class="button" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = cart.length ? cart.map(item => `<li>${item.name} - $${item.price}</li>`).join('') : 'Your cart is empty.';
        }

        function checkout(method) {
            document.getElementById('confirmation').style.display = 'block';
            document.getElementById('confirmation').textContent = `Payment successful with ${method === 'card' ? 'Card' : 'PayPal'}. Thank you for your purchase!`;
            cart.length = 0;
            renderCart();
        }

        renderProducts();
    </script>
</body>
</html>
