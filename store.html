<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <link rel="icon" type="image/x-icon" href="/images/circle_profile.png">
    <meta property="og:title" content="Eldersson" />
    <meta property="og:description" content="can you guess who made this" />
    <meta property="og:image" content="https://eldersson.netlify.app/images/circle_profile.png" />
    <meta property="og:url" content="https://eldersson.com/store/" />
    <script src="https://www.paypal.com/sdk/js?client-id=AS7i1lnT9wxbv2BKw15yUWQN3rmQxh_sxeqVoAUON78UQnIlVVTT3nla1C3SYd_k1rMFqF5TyENq82PN&currency=USD"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #007bff;}
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; background: linear-gradient(rgba(35, 34, 119, 0.6), #2f4385);}
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .cart { margin-top: 20px; }
        .button { padding: 10px 15px; background-color: #007bff; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
        .button:disabled { background-color: #ccc; }
    </style>
</head>
<body>
    <div class="grid" id="product-list"></div><div class="cart">
    <h2>Cart</h2>
    <ul id="cart-list"></ul>
    <div id="checkout-buttons">
        <div id="paypal-button-container"></div>
    </div>
    <p id="confirmation" style="display: none;"></p>
</div>

<script>
    const products = [
        { id: 1, name: 'Professional Merch', price: 44.99, image: 'images/merch.png' },
        { id: 2, name: 'Sleeping in Bedwars', price: 39.99, image: 'images/bedwars.png' },
        { id: 3, name: 'Skyblock Island', price: 39.99, image: 'images/skyblock.png' }
    ];

    const cart = [];

    function renderProducts() {
        const productList = document.getElementById('product-list');
        productList.innerHTML = products.map(p => `
            <div class="card">
                <img src="${p.image}" alt="${p.name}">
                <h2>${p.name}</h2>
                <p>$${p.price}</p>
                <label>Size:</label>
                <select id="size-${p.id}">
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                </select>
                <label>Type:</label>
                <select id="type-${p.id}">
                    <option value="Adult">Adult</option>
                    <option value="Youth">Youth</option>
                    <option value="Toddler">Toddler</option>
                </select>
                <button class="button" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const size = document.getElementById(`size-${id}`).value;
        const type = document.getElementById(`type-${id}`).value;
        cart.push({ ...product, size, type });
        renderCart();
    }

    function renderCart() {
        const cartList = document.getElementById('cart-list');
        cartList.innerHTML = cart.length ? cart.map(item => `<li>${item.name} - $${item.price} (Size: ${item.size}, Type: ${item.type})</li>`).join('') : 'Your cart is empty.';
    }

    paypal.Buttons({
        createOrder: function(data, actions) {
            const total = cart.reduce((sum, item) => sum + item.price, 0).toFixed(2);
            return actions.order.create({
                purchase_units: [{ amount: { value: total } }]
            });
        },
        onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
                document.getElementById('confirmation').style.display = 'block';
                document.getElementById('confirmation').textContent = 'Payment successful! Thank you, ' + details.payer.name.given_name + '!';
                cart.length = 0;
                renderCart();
            });
        }
    }).render('#paypal-button-container');

    renderProducts();
    renderCart();
</script>

</body>
</html>
