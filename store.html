<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .cart { margin-top: 20px; }
        .button { padding: 10px 15px; background-color: #007bff; color: #fff; border: none; cursor: pointer; border-radius: 5px; }
        .button:disabled { background-color: #ccc; }
    </style>
</head>
<body>
    <div class="grid" id="product-list"></div>

    <div class="cart">
        <h2>Cart</h2>
        <ul id="cart-list"></ul>
        <div id="checkout-buttons">
            <button class="button" onclick="checkout('paypal')">Checkout with PayPal</button>
        </div>
        <p id="confirmation" style="display: none;"></p>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Product 1', price: 19.99, image: 'https://via.placeholder.com/250x150' },
            { id: 2, name: 'Product 2', price: 29.99, image: 'https://via.placeholder.com/250x150' },
            { id: 3, name: 'Product 3', price: 39.99, image: 'https://via.placeholder.com/250x150' }
        ];

        const cart = [];

        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}">
                    <h2>${p.name}</h2>
                    <p>$${p.price}</p>
                    <button class="button" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = cart.length ? cart.map(item => `<li>${item.name} - $${item.price}</li>`).join('') : 'Your cart is empty.';
        }

        async function checkout(method) {
            if (method === 'paypal') {
                const total = cart.reduce((sum, item) => sum + item.price, 0).toFixed(2);
                window.location.href = `https://www.sandbox.paypal.com/checkoutnow?amount=${total}`;
            }
        }

        renderProducts();
    </script>
</body>
</html>
