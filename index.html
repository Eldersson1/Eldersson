<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            /* Sininen to violetti gradient */
            background: linear-gradient(to right, blue, violet);
            padding: 10px; /* Lisää tilaa nettisivujen reunoille */
        }

        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 30%; /* Tekee kuvasta pienemmän */
        }

        .round {
            border-radius: 50%;
        }

        .big-text {
            font-size: 50px;
            color: black;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        .small-text {
            font-size: 20px;
            color: black;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin-top: -40px; /* Siirtää "Joku random tyyppi" -tekstiä 40 pikseliä ylemmäs */
        }

        .line {
            width: 100%;
            height: 5px; /* Tekee viivasta 5 pikseliä paksun */
            background: black;
            margin-top: 10px;
            margin-bottom: 10px; /* Lisää tilaa linkkinappien ja viivan välille */
        }

        .icon {
            width: 50px;
            height: 50px;
            margin: 10px;
            transition: transform 0.3s;
        }

        .icon:hover {
            transform: scale(1.2);
        }

        .button {
            display: block;
            border-radius: 25px; /* Pyöristetty enemmän */
            background: url('planetmc.png') no-repeat center center; /* Kuvanappi, keskitetty */
            background-size: cover; /* Kuvan koko */
            border: 4px solid black; /* Mustat ääriviivat, 4px */
            color: white;
            text-align: center;
            font-size: 16px;
            padding: 50px 60px; /* Eka padding arvo 50px */
            cursor: pointer;
            margin: 20px auto; /* Siirtää nappia alemmas */
            width: calc(100% - 200px); /* Tekee napista melkein nettisivun levyisen */
        }

        .copyright {
            font-size: 14px;
            color: black;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 20px; /* Lisää tilaa copyright-tekstin ja napin välille */
        }

    </style>
</head>
<body>

    <img src="profiili.png" alt="Profiilikuva" class="center round">

    <p class="big-text">Eldersson</p>
    <p class="small-text">Joku random tyyppi</p>

    <div style="display: flex; justify-content: center;">
        <a href="https://www.youtube.com" target="_blank"><img src="youtube-icon.png" class="icon"></a>
        <a href="https://www.instagram.com" target="_blank"><img src="instagram-icon.png" class="icon"></a>
        <a href="https://www.tiktok.com" target="_blank"><img src="tiktok-icon.png" class="icon"></a>
        <a href="https://www.twitch.tv/eldersson" target="_blank"><img src="twitch-icon.png" class="icon"></a> <!-- Vaihdettu GitHub-iconi Twitch-iconiin -->
        <a href="https://discord.gg/Kkvphrwd3m" target="_blank"><img src="discord-icon.png" class="icon"></a> <!-- Lisätty Discord-iconi -->
    </div>

    <div class="line"></div>

    <a href="https://www.planetminecraft.com" target="_blank">
        <button class="button" style="vertical-align:middle"></button> <!-- Nappi, joka ei sisällä kuvaa -->
    </a>

    <div class="line"></div>

    <div style="display: flex; justify-content: center;">
        <a href="https://www.youtube.com" target="_blank"><img src="youtube-icon.png" class="icon"></a>
        <a href="https://www.instagram.com" target="_blank"><img src="instagram-icon.png" class="icon"></a>
        <a href="https://www.tiktok.com" target="_blank"><img src="tiktok-icon.png" class="icon"></a>
        <a href="https://www.twitch.tv/eldersson" target="_blank"><img src="twitch-icon.png" class="icon"></a> <!-- Vaihdettu GitHub-iconi Twitch-iconiin -->
        <a href="https://discord.gg/Kkvphrwd3m" target="_blank"><img src="discord-icon.png" class="icon"></a> <!-- Lisätty Discord-iconi -->
    </div>

    <p class="copyright">Copyright © Eldersson 2024</p> <!-- Copyright-teksti -->

</body>
</html>
